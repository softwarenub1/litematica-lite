name: Build Litematica 26.3 (baseline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack original source
        run: |
          test -f litematica-26.3.zip
          unzip -q litematica-26.3.zip -d source
          test -f source/litematica-26.3/gradlew

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build original Litematica
        working-directory: source/litematica-26.3
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace

      - name: Save compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: litematica-26.3-baseline
          path: source/litematica-26.3/build/libs/*.jar
          if-no-files-found: error
